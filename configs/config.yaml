# Central configuration for the calibrated_clinical_ai project
# All paths are placeholders. No real patient data is included or downloaded.

project:
  name: "calibrated_clinical_ai"
  description: "Confidence-Calibrated Machine Learning for Reliable In-Hospital Mortality Prediction"
  random_seed: 42

paths:
  data_raw: "data/raw/placeholder_raw_data.csv"
  data_processed: "data/processed/placeholder_processed_data.parquet"
  sql_dir: "sql/"
  outputs_tables: "outputs/tables/"
  outputs_figures: "outputs/figures/"
  models_dir: "outputs/models/"
  logs_dir: "logs/"

data:
  target_column: "in_hospital_mortality"
  id_column: "patient_id"
  test_size: 0.2
  validation_size: 0.1
  stratify: true

# MIMIC-IV local extraction settings (src/data_extract.py).
# CHECK_SCHEMA: db_backend/schema names must match your actual local
# data/raw/mimiciv load before running the extraction script.
mimic_iv:
  data_dir: "data/raw/mimiciv"        # local extract root; not committed
  db_backend: "duckdb"                # "duckdb" (files) or "postgres" (server)
  duckdb_path: "data/raw/mimiciv/mimiciv.duckdb"  # CHECK_SCHEMA: verify this file/catalog exists
  postgres:                            # only used if db_backend == "postgres"
    host: "localhost"
    port: 5432
    dbname: "mimiciv"
    user: "CHECK_SCHEMA_SET_ME"
    schema_hosp: "mimiciv_hosp"
    schema_icu: "mimiciv_icu"
  cohort_sql: "sql/cohort.sql"
  features_sql: "sql/features.sql"
  cohort_table_name: "cohort_table"    # CHECK_SCHEMA: name features.sql's cohort CTE resolves against
  output_path: "data/processed/icu_first24h_mortality.parquet"
  identifier_columns: ["subject_id", "hadm_id", "stay_id"]
  split_id_column: "subject_id"

# MIMIC-IV Clinical Database DEMO (v2.2) cohort build (src/build_demo_cohort.py,
# notebooks/00_demo_cohort_check.ipynb). Separate from mimic_iv above, which
# targets a full local database/catalog — this targets the small (~100
# patient) publicly available CSV demo extracted directly into a folder.
# CHECK_SCHEMA: file names/subfolder layout below assume the standard
# MIMIC-IV Demo v2.2 distribution (hosp/ and icu/ subfolders, .csv or
# .csv.gz). Verify against what you actually extracted.
demo_cohort:
  demo_data_dir: "data/raw/mimic_iv_demo"
  output_path: "data/processed/cohort_features.parquet"
  target_column: "mortality"   # NOTE: differs from preprocessing.target_column ("in_hospital_mortality") — see build_demo_cohort.py docstring
  id_column: "subject_id"
  min_los_days: 1.0            # >=24h ICU stay required for a full first-24h feature window
  min_age: 18
  age_group_cutoffs: [65]

# Cohort audit + preprocessing settings (src/preprocess.py,
# notebooks/01_cohort_audit.ipynb).
# ASSUMPTION: cohort_features_path points at the JOIN of cohort.sql +
# features.sql output — i.e. identifiers + features + target together —
# NOT the identifier-free table written by mimic_iv.output_path above.
# Adjust if your extraction pipeline names/locates this file differently.
preprocessing:
  cohort_features_path: "data/processed/cohort_features.parquet"
  id_column: "subject_id"
  target_column: "mortality"   # matches demo_cohort.target_column and src/build_demo_cohort.py's output column
  identifier_columns: ["subject_id", "hadm_id", "stay_id"]
  train_size: 0.7
  val_size: 0.1
  test_size: 0.2
  random_seed: 42
  preprocessor_output_path: "outputs/models/preprocessor.joblib"

models:
  logistic_regression:
    penalty: "l2"
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42
    class_weight: "balanced"  # handles class imbalance (mortality is a minority outcome)
    C_grid: [0.001, 0.01, 0.1, 1.0, 10.0]  # candidates; best C selected on validation AUROC
  random_forest:
    n_estimators: 300
    max_depth: 10
    random_state: 42
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    random_state: 42
  lightgbm:
    n_estimators: 300          # upper bound; early stopping picks the actual best_iteration
    max_depth: -1
    learning_rate_grid: [0.01, 0.05, 0.1]  # candidates; best selected on validation AUROC
    num_leaves: 31
    random_state: 42
    early_stopping_rounds: 20
    auto_scale_pos_weight: true  # scale_pos_weight computed from TRAIN class counts at runtime, not hardcoded
  mlp_torch:
    hidden_dims: [128, 64]
    max_epochs: 100             # upper bound; early stopping halts before this if val loss plateaus
    learning_rate: 0.001
    batch_size: 64
    random_state: 42
    early_stopping_patience: 10  # epochs without val-loss improvement before stopping

training:
  models_output_dir: "outputs/models/"
  tables_output_dir: "outputs/tables/"
  hyperparameters_table_path: "outputs/tables/table_2_hyperparameters.csv"
  run_metadata_path: "logs/train_models_run_metadata.json"
  # Paper pipeline (notebooks/02_train_models.ipynb, current spec): long-format
  # validation predictions across models, for notebooks/03_calibration.ipynb.
  val_predictions_path: "outputs/predictions/val_predictions.parquet"
  models_trained: ["logistic_regression", "lightgbm"]

calibration:
  methods: ["uncalibrated", "platt", "isotonic", "temperature_scaling"]  # temperature_scaling applies to mlp_torch only
  ece_bins: [10, 15]
  adaptive_ece_bins: 10
  mce_bins: 10
  cv_folds: 5
  models_output_dir: "outputs/models/"
  metrics_table_path: "outputs/tables/table_3_calibration_metrics.csv"
  figures_output_dir: "outputs/figures/"
  run_metadata_path: "logs/calibration_run_metadata.json"

evaluation:
  metrics: ["auroc", "auprc", "brier_score", "ece", "mce", "log_loss"]

# Selective prediction / clinician-referral safety layer
# (src/selective_prediction.py, notebooks/04_selective_prediction.ipynb).
# CLINICAL FRAMING: this is a decision-support referral layer, not an
# autonomous diagnostic system — see CLINICAL_DISCLAIMER in
# src/selective_prediction.py. "Accepted" cases still require clinician
# review of the model's output; "referred" cases require full,
# un-model-assisted clinician review because model confidence was too low.
selective_prediction:
  referral_rates: [0.0, 0.05, 0.10, 0.20, 0.30]
  decision_threshold: 0.5
  ece_bins: 10
  # Candidate calibration methods per model; the method with the lowest
  # validation ece_10bins (from table_3_calibration_metrics.csv) is
  # selected automatically for each model — not hardcoded.
  calibration_candidates:
    logistic_regression: ["platt", "isotonic"]
    lightgbm: ["platt", "isotonic"]
    mlp_torch: ["platt", "isotonic", "temperature"]
  models_output_dir: "outputs/models/"
  tables_output_dir: "outputs/tables/"
  figures_output_dir: "outputs/figures/"
  referral_policy_table_path: "outputs/tables/table_4_clinical_referral_policy.csv"
  run_metadata_path: "logs/selective_prediction_run_metadata.json"


# Final held-out test-set evaluation (src/evaluate_final.py,
# notebooks/05_final_evaluation.ipynb).
# TEST-SET POLICY: this is the ONLY stage of the project that touches test
# LABELS. Every choice evaluated here (model hyperparameters, calibration
# method per model, referral-rate grid, decision threshold) was already
# frozen using train/validation data in notebooks 01-04 — this stage only
# computes metrics against those frozen choices, it never searches over
# alternatives using test performance.
final_evaluation:
  n_bootstrap: 1000
  ci_alpha: 0.05           # 95% CI
  decision_threshold: 0.5  # must match selective_prediction.decision_threshold
  ece_bins: 10
  min_subgroup_size: 20        # subgroup levels smaller than this are skipped (NaN + note), not approximated
  min_subgroup_events: 5       # subgroup levels with fewer positive cases than this are skipped
  subgroup_columns: ["gender", "age_group", "admission_type", "first_careunit", "race"]
  age_group_cutoffs: [65]      # standard elderly-ICU-mortality-risk cutoff; adjust per your study
  models_output_dir: "outputs/models/"
  calibration_models_output_dir: "outputs/models/"
  tables_output_dir: "outputs/tables/"
  main_results_table_path: "outputs/tables/table_3_main_results.csv"
  clinical_thresholds_table_path: "outputs/tables/table_4_clinical_thresholds.csv"
  ablation_study_table_path: "outputs/tables/table_5_ablation_study.csv"
  subgroup_results_table_path: "outputs/tables/table_6_subgroup_results.csv"
  run_metadata_path: "logs/final_evaluation_run_metadata.json"
  test_usage_marker_path: "logs/.test_set_evaluation_marker.json"

# Publication figure/table export (src/plot_publication_figures.py,
# notebooks/06_publication_outputs.ipynb). Reads ONLY already-computed
# files under outputs/tables/ (including test_predictions_*.csv, saved by
# src.evaluate_final.run_final_evaluation as a byproduct of the project's
# single authorized test-set evaluation) — never recomputes predictions or
# fabricates values.
publication:
  dpi: 300
  figures_output_dir: "outputs/figures/"
  tables_output_dir: "outputs/tables/"
  mermaid_output_dir: "outputs/figures/"
  cohort_flow_table_path: "outputs/tables/cohort_flow_counts.csv"
  cohort_characteristics_table_path: "outputs/tables/table1_cohort_characteristics.csv"
  hyperparameters_table_path: "outputs/tables/table_2_hyperparameters.csv"
  main_results_table_path: "outputs/tables/table_3_main_results.csv"
  clinical_thresholds_table_path: "outputs/tables/table_4_clinical_thresholds.csv"
  ablation_study_table_path: "outputs/tables/table_5_ablation_study.csv"
  subgroup_results_table_path: "outputs/tables/table_6_subgroup_results.csv"
  subgroup_comparison_variable: "gender"  # which subgroup_columns level is used for Figure 7 by default
  run_metadata_path: "logs/publication_outputs_run_metadata.json"

# --- Paper pipeline: notebooks/04_final_evaluation.ipynb ---
# TEST-SET POLICY: this is the ONLY notebook in the paper pipeline
# (01-05) that touches test-set labels. Model hyperparameters (02) and
# calibration method choice (03) are already frozen before this notebook
# runs; it only computes metrics against those frozen choices.
paper_final_evaluation:
  n_bootstrap: 1000              # for AUROC, Brier, ECE only, per task spec
  ci_alpha: 0.05
  ece_bins: 10
  decision_threshold: 0.2        # clinically reasonable threshold per task spec; also reports 0.5 for reference
  models_output_dir: "outputs/models/"
  predictions_output_dir: "outputs/predictions/"
  tables_output_dir: "outputs/tables/"
  figures_output_dir: "outputs/figures/"
  main_results_table_path: "outputs/tables/table_4_main_results.csv"
  clinical_thresholds_table_path: "outputs/tables/table_5_clinical_thresholds.csv"
  test_predictions_path: "outputs/predictions/test_predictions.parquet"
  run_metadata_path: "logs/paper_final_evaluation_run_metadata.json"
  test_usage_marker_path: "logs/.paper_test_set_evaluation_marker.json"

# --- Paper pipeline: notebooks/05_publication_outputs.ipynb ---
paper_publication:
  dpi: 300
  figures_output_dir: "outputs/figures/"
  tables_output_dir: "outputs/tables/"
  mermaid_output_dir: "outputs/figures/"
  captions_path: "docs/figure_table_captions.md"
  best_models_for_reliability: 2  # top-N (model, calibration_method) pairs by AUROC shown in Figure 3

logging:
  level: "INFO"
  log_file: "logs/run.log"
