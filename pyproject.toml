[project]
name = "calibrated-clinical-ai"
version = "0.1.0"
description = "Confidence-Calibrated Machine Learning for Reliable In-Hospital Mortality Prediction"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [
    { name = "Research Author" }
]
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "xgboost==2.1.0",
    "lightgbm==4.5.0",
    "torch==2.3.1",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "scipy==1.13.1",
    "statsmodels==0.14.2",
    "shap==0.46.0",
    "jupyter==1.0.0",
    "joblib==1.4.2",
    "pyarrow==16.1.0",
    "pyyaml==6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
